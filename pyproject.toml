[project]
name = "ecommerce-fullstack"
version = "0.1.0"
description = "Full-stack E-Commerce & Inventory Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    "psycopg[binary]>=3.3.5",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.54",
    "alembic>=1.20.0",
    "cloudinary>=1.46.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
